# Render blueprint for the Nuskha Saathi safety engine.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: nuskha-saathi-api
    runtime: docker
    rootDir: nuskha-saathi/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these when the blueprint is applied.
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_MONITOR_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Optional second reader. Leave blank to use Gemini only.
      - key: OPENROUTER_API_KEY
        sync: false
      # Free third-party services (no key). Set to "false" to keep prescription
      # photos, voice notes and medicine names on Gemini and openFDA only.
      - key: FREEAPI_IMGCHAT_ENABLED
        value: "true"
      - key: FREEAPI_TRANSCRIBE_ENABLED
        value: "true"
      - key: MEDSTER_LIVE
        value: "true"
      - key: MEDICINE_WEB_LIVE
        value: "true"
      # Starting Urdu voice: uzma, asad, gul or salman. The panel can change it.
      - key: URDU_TTS_VOICE
        value: uzma
      # Set both to your frontend origin after the frontend is deployed.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SCAN_RATE_LIMIT_PER_MINUTE
        value: "30"
