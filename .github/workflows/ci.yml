name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend safety engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuskha-saathi/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nuskha-saathi/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and route tests
        run: python -m pytest -q
      - name: 30-case deterministic safety benchmark
        run: python -m tests.run_eval_30

