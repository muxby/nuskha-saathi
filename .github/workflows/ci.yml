name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend safety engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuskha-saathi/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nuskha-saathi/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and route tests
        run: python -m pytest -q
      - name: 30-case deterministic safety benchmark
        run: python -m tests.run_eval_30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuskha-saathi/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nuskha-saathi/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nuskha-saathi/frontend/package-lock.json
      - name: Start the safety engine
        working-directory: nuskha-saathi/backend
        env:
          # Browser checks must not depend on the live voice provider.
          FREEAPI_TTS_ENABLED: "0"
        run: |
          pip install -r requirements.txt
          python -m uvicorn main:app --port 8000 &
      - name: Build and start the app
        working-directory: nuskha-saathi/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start &
          npx --yes wait-on@8 http://localhost:3000 http://localhost:8000/health
      - name: Mocked UI and accessibility suite
        working-directory: nuskha-saathi/frontend
        env:
          UI_TEST_BROWSER: chromium
        run: npm run test:ui
      - name: Unmocked end-to-end suite
        working-directory: nuskha-saathi/frontend
        run: npm run test:e2e
