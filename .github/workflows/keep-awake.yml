# Pings the backend so a free instance does not fall asleep between visitors.
#
# Enable it: repository Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable
#   name:  BACKEND_HEALTH_URL
#   value: https://YOUR-API.onrender.com/health
# Without that variable the job is skipped. Delete the variable to stop it.
#
# GitHub may delay scheduled runs by several minutes, so an occasional cold
# start is still possible. An always-on instance uses the host's free hours.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping health endpoint
    if: ${{ vars.BACKEND_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the backend
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out 'health %{http_code} in %{time_total}s\n' \
            "$HEALTH_URL"
