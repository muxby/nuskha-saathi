# Render blueprint for the Nuskha Saathi safety engine.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: nuskha-saathi-api
    runtime: docker
    rootDir: nuskha-saathi/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these when the blueprint is applied.
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_MONITOR_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Set both to your frontend origin after the frontend is deployed.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SCAN_RATE_LIMIT_PER_MINUTE
        value: "30"
